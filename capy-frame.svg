<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="260" height="260" viewBox="0 0 260 260" role="img" aria-label="Capybara Jedi Master">
  <defs>
    <!-- Свечение для рамки -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Обрезка фона под круг -->
    <clipPath id="circleClip">
      <circle cx="130" cy="130" r="110" />
    </clipPath>
  </defs>

  <!-- === ФОН (Оранжевый круг с тенью) === -->
  <g clip-path="url(#circleClip)">
    <!-- Основной оранжевый фон -->
    <rect x="20" y="20" width="220" height="220" fill="#E54B25" />
    
    <!-- Длинная тень (Long Shadow) справа внизу -->
    <polygon points="130,240 240,130 240,240" fill="#C93615" />
    
    <!-- === КАПИБАРА === -->
    <!-- Уши -->
    <path d="M 95 95 Q 85 70 105 85 Z" fill="#8C8172"/>
    <path d="M 165 95 Q 175 70 155 85 Z" fill="#8C8172"/>
    <path d="M 97 93 Q 90 78 103 87 Z" fill="#A69A8A"/>
    <path d="M 163 93 Q 170 78 157 87 Z" fill="#A69A8A"/>

    <!-- Основа головы -->
    <ellipse cx="130" cy="140" rx="45" ry="52" fill="#B0A493"/>
    
    <!-- Темная макушка -->
    <path d="M 85 120 Q 130 60 175 120 Q 130 90 85 120 Z" fill="#7D7365"/>
    <path d="M 100 95 Q 130 75 160 95 Q 130 105 100 95 Z" fill="#5A5247"/>

    <!-- Светлая морда -->
    <ellipse cx="130" cy="155" rx="30" ry="35" fill="#D7CCB9"/>

    <!-- Глаза -->
    <!-- Левый глаз -->
    <circle cx="108" cy="130" r="7" fill="#1A1A1A"/>
    <circle cx="106" cy="128" r="2" fill="#FFFFFF"/>
    <path d="M 102 124 Q 108 120 114 124" stroke="#E54B25" stroke-width="2" fill="none"/>
    <!-- Правый глаз -->
    <circle cx="152" cy="130" r="7" fill="#1A1A1A"/>
    <circle cx="150" cy="128" r="2" fill="#FFFFFF"/>
    <path d="M 146 124 Q 152 120 158 124" stroke="#E54B25" stroke-width="2" fill="none"/>

    <!-- Нос -->
    <path d="M 115 145 Q 130 135 145 145 Q 145 155 130 155 Q 115 155 115 145 Z" fill="#332D26"/>
    <!-- Ноздри -->
    <ellipse cx="122" cy="147" rx="3" ry="2" fill="#000000"/>
    <ellipse cx="138" cy="147" rx="3" ry="2" fill="#000000"/>

    <!-- Рот и зубы -->
    <path d="M 115 160 Q 130 170 145 160" stroke="#332D26" stroke-width="2" fill="none"/>
    <path d="M 125 162 L 125 168 L 135 168 L 135 162 Z" fill="#FFFFFF"/>

    <!-- Пушистые щеки (белая шерсть) -->
    <path d="M 100 150 L 105 155 L 102 162 L 110 165 L 108 172 L 115 175 L 112 182 
             Q 130 190 148 182 L 145 175 L 152 172 L 150 165 L 158 162 L 155 155 L 160 150 
             Q 130 165 100 150 Z" fill="#F2EFE9"/>
  </g>

  <!-- === АНИМИРОВАННАЯ РАМКА === -->
  <!-- Дышащее неоновое кольцо -->
  <rect x="4" y="4" width="252" height="252" rx="22" ry="22"
        fill="none" stroke="#22f7f7" stroke-width="3"
        filter="url(#softGlow)">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35"
             dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Чёткая неоновая обводка -->
  <rect x="9" y="9" width="242" height="242" rx="20" ry="20"
        fill="none" stroke="#22f7f7" stroke-width="2"/>

  <!-- Тонкий золотой акцент -->
  <rect x="14" y="14" width="232" height="232" rx="17" ry="17"
        fill="none" stroke="#d4af37" stroke-width="0.8" opacity="0.55"/>
</svg>
